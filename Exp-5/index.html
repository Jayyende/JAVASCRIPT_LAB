
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5 - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Shopping Cart Calculator</h1>
            <p>Select products and quantities to calculate your cart total.</p>
        </header>

        <section>
            <h2>Available Products</h2>
            <p class="subtitle">Choose your products below.</p>

            <div class="product-grid" id="productList"></div>
        </section>

        <section class="cart-section">

            <div class="cart-box">
                <h2>Your Cart</h2>
                <div id="cartItems">
                    <p class="empty">Your cart is empty.</p>
                </div>
            </div>

            <div class="summary-box">
                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0.00</span>
                </div>

                <div class="summary-row discount">
                    <span>Discount (20%)</span>
                    <span id="discount">- ₹0.00</span>
                </div>

                <hr>

                <div class="summary-row total">
                    <strong>Total</strong>
                    <strong id="total">₹0.00</strong>
                </div>

                <p id="discountMessage" class="discount-message">
                    Add products worth ₹50,000 to unlock 20% discount!
                </p>

                <button id="clearCart" class="clear-btn">
                    Clear Cart
                </button>

            </div>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
