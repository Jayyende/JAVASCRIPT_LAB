
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 7 - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>My To-Do List</h1>
            <p>Organize your daily tasks and stay productive.</p>
        </header>

        <!-- Add Task Section -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addBtn">Add Task</button>

        </div>

        <!-- Task Statistics -->
        <div class="task-info">
            <span>Total Tasks: <strong id="totalTasks">0</strong></span>
            <span>Pending: <strong id="pendingTasks">0</strong></span>
            <span>Completed: <strong id="completedTasks">0</strong></span>
        </div>

        <!-- Task List -->
        <section class="task-section">

            <h2>Your Tasks</h2>

            <ul id="taskList">
                <li class="empty">No tasks added yet.</li>
            </ul>

        </section>

        <button id="clearBtn" class="clear-btn">
            Clear All Tasks
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
